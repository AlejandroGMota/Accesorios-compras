<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div>
        <h1>Admin</h1>
        <p class="header-subtitle">Crear y editar locales</p>
    </div>
    <nav class="header-nav">
        <a href="index.html" class="header-link">Tianguis</a>
        <a href="locales.html" class="header-link">Locales</a>
        <a href="global.html" class="header-link">Lista global</a>
    </nav>
</header>

<div class="container">

    <div class="card">
        <h2>Nuevo local</h2>
        <label for="nuevoNombre">Nombre del local</label>
        <input type="text" id="nuevoNombre" placeholder="Ej. Local Centro" maxlength="60">
        <button id="crearLocalBtn" class="btn-primary">Crear local</button>
    </div>

    <div class="card">
        <h2>Locales</h2>
        <p class="chart-note">Un local inactivo conserva su lista, pero deja de sumar en la global. Solo se puede borrar si su lista está vacía.</p>
        <div class="table-wrapper">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Local</th>
                        <th>Productos</th>
                        <th>Liga</th>
                        <th>Estado</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="tbodyAdmin"></tbody>
            </table>
        </div>
    </div>

</div>

<div id="toast" role="status" aria-live="polite"></div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-check-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

<!-- Firebase init — config inyectada por GitHub Actions -->
<script>
    const firebaseConfig = %%FIREBASE_CONFIG%%;
    firebase.initializeApp(firebaseConfig);
    // App Check: la base solo acepta peticiones que vengan de este sitio.
    // Mientras no haya llave (placeholder sin reemplazar), no se activa y todo sigue igual.
    const APPCHECK_SITE_KEY = '%%APPCHECK_SITE_KEY%%';
    const APPCHECK_PROVIDER = '%%APPCHECK_PROVIDER%%';   // 'enterprise' o vacío (reCAPTCHA v3)
    if (!APPCHECK_SITE_KEY.startsWith('%%')) {
        firebase.appCheck().activate(
            APPCHECK_PROVIDER === 'enterprise'
                ? new firebase.appCheck.ReCaptchaEnterpriseProvider(APPCHECK_SITE_KEY)
                : APPCHECK_SITE_KEY,
            true);
        console.info('App Check activo (%s)', APPCHECK_PROVIDER === 'enterprise' ? 'reCAPTCHA Enterprise' : 'reCAPTCHA');
    } else {
        console.info('App Check sin configurar: falta el secret APPCHECK_SITE_KEY.');
    }
    const db = firebase.firestore();
    db.enablePersistence().catch(err => console.warn('Persistencia offline no disponible:', err.code));
</script>


<script src="auth.js"></script>
<script src="admin.js"></script>
</body>
</html>
