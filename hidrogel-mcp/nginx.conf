# /etc/nginx/sites-available/hidrogel en la VM de Oracle.
# certbot --nginx agrega el bloque 443 y la redirección de 80 → 443.
server {
    listen 80;
    server_name hidrogel.alejandrogmota.com;

    # La URL del conector lleva el token
    access_log off;

    location /mcp/ {
        proxy_pass http://127.0.0.1:8030;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        return 404;
    }
}
