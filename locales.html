<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Locales</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div>
        <h1>Locales</h1>
        <p class="header-subtitle">Las listas de cada punto de venta</p>
    </div>
    <nav class="header-nav">
        <a href="index.html" class="header-link">Tianguis</a>
        <a href="global.html" class="header-link">Lista global</a>
        <a href="admin.html" class="header-link">Admin</a>
    </nav>
</header>

<div class="container">

    <div class="card">
        <h2>Listas abiertas</h2>
        <p class="chart-note">Cada local tiene su propia liga. Pásasela a quien anota ahí y todo lo que escriba cae en la lista global.</p>
        <div id="listaLocales"><p class="muted">Cargando…</p></div>
    </div>

</div>

<div id="toast" role="status" aria-live="polite"></div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-check-compat.js"></script>

<!-- Firebase init — config inyectada por GitHub Actions -->
<script>
    const firebaseConfig = %%FIREBASE_CONFIG%%;
    firebase.initializeApp(firebaseConfig);
    // App Check: la base solo acepta peticiones que vengan de este sitio.
    // Mientras no haya llave (placeholder sin reemplazar), no se activa y todo sigue igual.
    const APPCHECK_SITE_KEY = '%%APPCHECK_SITE_KEY%%';
    const APPCHECK_PROVIDER = '%%APPCHECK_PROVIDER%%';   // 'enterprise' o vacío (reCAPTCHA v3)
    if (!APPCHECK_SITE_KEY.startsWith('%%')) {
        firebase.appCheck().activate(
            APPCHECK_PROVIDER === 'enterprise'
                ? new firebase.appCheck.ReCaptchaEnterpriseProvider(APPCHECK_SITE_KEY)
                : APPCHECK_SITE_KEY,
            true);
        console.info('App Check activo (%s)', APPCHECK_PROVIDER === 'enterprise' ? 'reCAPTCHA Enterprise' : 'reCAPTCHA');
    } else {
        console.info('App Check sin configurar: falta el secret APPCHECK_SITE_KEY.');
    }
    const db = firebase.firestore();
    db.enablePersistence().catch(err => console.warn('Persistencia offline no disponible:', err.code));
</script>


<script src="locales.js"></script>
</body>
</html>
